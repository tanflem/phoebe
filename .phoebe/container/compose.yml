# Dogfood compose file — Phoebe working its own repo.
#
# Adapted from the `phoebe init` scaffold (templates/container/compose.yml).
# Same shape — one long-lived container whose main process is `phoebe boot` —
# but both the bootstrapper and the engine come from the host working tree
# mounted at /opt/phoebe-engine, not from npm and not from a GitHub checkout.
# That is the whole point here: run exactly what is checked out, with no
# publish, no rebuild, and no push in the loop. The README lists every
# deviation from the shipped scaffold and what they cost in coverage.
#
#   ./.phoebe/run.sh                      # persistent loop (foreground)
#   ./.phoebe/run.sh --run-once           # work exactly one unit, then exit
#   ./.phoebe/run.sh --dry-run --run-once # selection preview, nothing executes
#
# Ctrl-C or `docker stop` sends SIGTERM, which drains: the engine finishes its
# current work unit, starts no new one, and exits 0. The signal is forwarded the
# whole way down — tini → `boot` → engine.

services:
  phoebe:
    build:
      context: .
      args:
        PHOEBE_INSTALL_COMMAND: "pnpm install --frozen-lockfile"
    image: phoebe-runtime:dogfood
    labels:
      org.jesusfilm.phoebe.role: agent
      org.jesusfilm.phoebe.observer-version: "1"
    # Keep tini as PID 1 (reaps zombies, forwards signals), but run the
    # bootstrapper from the mount instead of a globally installed `phoebe`.
    # bootstrap/cli.ts is TypeScript and lives outside node_modules here, so
    # Node 24 type-strips it directly. `command:` replaces CMD, so engine flags
    # passed on the command line append to this and `boot` forwards them on.
    entrypoint: ["/usr/bin/tini", "--", "node", "/opt/phoebe-engine/bootstrap/cli.ts", "boot"]
    command: []
    # Read the config through the working-tree mount rather than a single-file
    # bind mount. A file bind mount pins the host *inode*, so an editor that
    # saves by writing a new file and renaming it over the old one is invisible
    # inside the container — and `boot`'s config watch would never fire. Under a
    # directory mount the rename is seen normally. Prompts resolve relative to
    # this cwd too (.phoebe/prompts).
    working_dir: /opt/phoebe-engine/.phoebe
    environment:
      # Secrets — populate via `.env` (see `.env.example`).
      GH_TOKEN: "${GH_TOKEN:?GH_TOKEN is required}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_KEY: "${OPENAI_KEY:-}"
      PHOEBE_ENGINE_DIR: /data/engine
      PHOEBE_AGENT: "${PHOEBE_AGENT:-}"
      PHOEBE_MODEL: "${PHOEBE_MODEL:-}"
      PHOEBE_POLL_INTERVAL_MS: "${PHOEBE_POLL_INTERVAL_MS:-}"
      # A minute is a long time to wait when demonstrating a relaunch; the
      # reconcile poll is one stat (plus one ls-remote for a github source), so
      # ten seconds is cheap here.
      PHOEBE_RECONCILE_INTERVAL_MS: "${PHOEBE_RECONCILE_INTERVAL_MS:-10000}"
    volumes:
      - phoebe-repo:/data/repo
      - phoebe-worktrees:/data/worktrees
      - phoebe-state:/data/state
      # Unused while `engine.source` is "local"; here so flipping the config to
      # a github ref does not also need a compose edit.
      - phoebe-engine:/data/engine
      # The working tree: the bootstrapper above, the engine `boot` execs for
      # `engine: { source: "local" }`, and the config + prompts under .phoebe.
      # Read-only — the engine works its target clone under /data, never its own
      # source. The repo *root* is mounted so package.json (`"type": "module"`)
      # sits alongside the `.ts` that Node type-strips.
      - ../..:/opt/phoebe-engine:ro

volumes:
  phoebe-repo:
  phoebe-worktrees:
  phoebe-state:
  phoebe-engine:
